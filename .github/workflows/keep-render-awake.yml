name: Keep Render API Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Haven API health endpoint
        run: |
          curl --fail --silent --show-error --max-time 60 \
            https://haven-youth-anchor-api.onrender.com/api/v1/health
